<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafetyWing Clip Search</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f7f8;
      color: #111;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .logo { font-size: 22px; }
    header h1 { font-size: 17px; font-weight: 600; color: #111; }
    header p  { font-size: 13px; color: #888; margin-top: 1px; }

    /* ── Search area ── */
    .search-wrap {
      max-width: 780px;
      margin: 48px auto 0;
      padding: 0 24px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .search-input {
      flex: 1;
      padding: 14px 18px;
      font-size: 15px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      outline: none;
      background: #fff;
      transition: border-color .15s;
    }
    .search-input:focus { border-color: #6c47ff; }
    .search-input::placeholder { color: #bbb; }

    .search-btn {
      padding: 14px 24px;
      background: #6c47ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    .search-btn:hover { background: #5a38e0; }
    .search-btn:disabled { background: #b0a0f0; cursor: not-allowed; }

    /* ── Platform chips ── */
    .filters {
      margin-top: 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-label { font-size: 13px; color: #888; margin-right: 4px; }

    .chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      border: 1.5px solid #e0e0e0;
      background: #fff;
      cursor: pointer;
      color: #555;
      transition: all .15s;
    }
    .chip:hover { border-color: #6c47ff; color: #6c47ff; }
    .chip.active {
      background: #6c47ff;
      border-color: #6c47ff;
      color: #fff;
    }

    /* Speaker filter */
    .speaker-filter {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .speaker-filter label { font-size: 13px; color: #888; }
    .speaker-filter input {
      padding: 6px 12px;
      font-size: 13px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      outline: none;
      width: 200px;
      transition: border-color .15s;
    }
    .speaker-filter input:focus { border-color: #6c47ff; }

    /* ── Results ── */
    .results-wrap {
      max-width: 780px;
      margin: 32px auto 64px;
      padding: 0 24px;
    }

    .results-header {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
    }

    .empty-state {
      text-align: center;
      padding: 64px 0;
      color: #aaa;
    }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }

    /* ── Result card ── */
    .card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 14px;
      transition: box-shadow .15s;
    }
    .card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.07); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-meta { display: flex; flex-direction: column; gap: 4px; }

    .speaker-name {
      font-size: 14px;
      font-weight: 600;
      color: #6c47ff;
    }

    .video-id {
      font-size: 12px;
      color: #999;
      font-family: monospace;
    }

    .badges { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }

    .badge {
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .3px;
    }
    .badge-platform { background: #f0ecff; color: #6c47ff; }
    .badge-duration { background: #f0f0f0; color: #555; }
    .badge-score    { background: #e8f5e9; color: #2e7d32; }

    .quote {
      font-size: 14px;
      line-height: 1.6;
      color: #333;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .timestamps {
      font-size: 13px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .timestamps .ts {
      background: #f5f5f5;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      font-weight: 600;
      color: #222;
    }
    .timestamps .arrow { color: #bbb; }

    .copy-btn {
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      color: #555;
      transition: all .15s;
      white-space: nowrap;
    }
    .copy-btn:hover { border-color: #6c47ff; color: #6c47ff; }
    .copy-btn.copied { border-color: #4caf50; color: #4caf50; }

    /* ── Loading spinner ── */
    .spinner {
      display: none;
      text-align: center;
      padding: 48px 0;
      color: #888;
      font-size: 14px;
    }
    .spinner.active { display: block; }
    .spinner::before {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      border: 3px solid #e0e0e0;
      border-top-color: #6c47ff;
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: #fff0f0;
      border: 1px solid #ffd0d0;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 14px;
      color: #c00;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🎬</div>
  <div>
    <h1>SafetyWing Clip Search</h1>
    <p>Find the perfect clip from any video — just describe what you're looking for</p>
  </div>
</header>

<div class="search-wrap">
  <div class="search-box">
    <input
      class="search-input"
      id="queryInput"
      type="text"
      placeholder='e.g. "Sondre on why he founded SafetyWing" or "remote work and community"'
      autocomplete="off"
    />
    <button class="search-btn" id="searchBtn" onclick="doSearch()">Search</button>
  </div>

  <div class="filters">
    <span class="filter-label">Platform:</span>
    <button class="chip active" data-platform="all"     onclick="setChip(this)">All lengths</button>
    <button class="chip"        data-platform="tiktok"  onclick="setChip(this)">TikTok / Reels ≤60s</button>
    <button class="chip"        data-platform="linkedin" onclick="setChip(this)">LinkedIn ≤90s</button>
  </div>

  <div class="speaker-filter">
    <label for="speakerInput">Speaker (optional):</label>
    <input id="speakerInput" type="text" placeholder="e.g. Sondre Rasch" />
  </div>
</div>

<div class="results-wrap">
  <div class="spinner" id="spinner">Searching transcripts…</div>
  <div id="errorMsg" class="error-msg" style="display:none"></div>
  <div id="resultsHeader" class="results-header" style="display:none"></div>
  <div id="results"></div>
  <div class="empty-state" id="emptyState">
    <div class="icon">🔍</div>
    <p>Search across all video transcripts to find the perfect clip</p>
  </div>
</div>

<script>
  let selectedPlatform = 'all';

  function setChip(el) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    selectedPlatform = el.dataset.platform;
  }

  document.getElementById('queryInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  async function doSearch() {
    const query   = document.getElementById('queryInput').value.trim();
    const speaker = document.getElementById('speakerInput').value.trim() || null;
    if (!query) return;

    setLoading(true);
    clearResults();

    try {
      const res = await fetch('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, platform: selectedPlatform, speaker })
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Search failed');
      renderResults(data.results, query);
    } catch (err) {
      showError(err.message);
    } finally {
      setLoading(false);
    }
  }

  function renderResults(results, query) {
    const container = document.getElementById('results');
    const header    = document.getElementById('resultsHeader');
    const empty     = document.getElementById('emptyState');

    if (!results || results.length === 0) {
      header.style.display = 'none';
      empty.style.display  = 'block';
      empty.querySelector('p').textContent = 'No matching clips found. Try different keywords.';
      return;
    }

    empty.style.display  = 'none';
    header.style.display = 'block';
    header.textContent   = `${results.length} clips found for "${query}"`;

    container.innerHTML = results.map(r => `
      <div class="card">
        <div class="card-top">
          <div class="card-meta">
            <span class="speaker-name">${esc(r.speaker_name)}</span>
            <span class="video-id">${esc(r.video_title || r.video_id)}</span>
          </div>
          <div class="badges">
            <span class="badge badge-duration">${formatDuration(r.duration_ms)}</span>
            <span class="badge badge-score">${r.similarity}% match</span>
          </div>
        </div>
        <p class="quote">"${esc(r.text)}"</p>
        <div class="card-bottom">
          <div class="timestamps">
            <span class="ts">${esc(r.start_fmt)}</span>
            <span class="arrow">→</span>
            <span class="ts">${esc(r.end_fmt)}</span>
          </div>
          <button class="copy-btn" onclick="copyTimestamps(this, '${esc(r.video_id)}', '${esc(r.start_fmt)}', '${esc(r.end_fmt)}')">
            Copy timestamps
          </button>
        </div>
      </div>
    `).join('');
  }

  function copyTimestamps(btn, videoId, start, end) {
    const text = `${videoId}  ${start} → ${end}`;
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '✓ Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy timestamps';
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  function formatDuration(ms) {
    const s = Math.round(ms / 1000);
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60), r = s % 60;
    return r > 0 ? `${m}m ${r}s` : `${m}m`;
  }

  function setLoading(on) {
    document.getElementById('spinner').classList.toggle('active', on);
    document.getElementById('searchBtn').disabled = on;
  }

  function clearResults() {
    document.getElementById('results').innerHTML = '';
    document.getElementById('resultsHeader').style.display = 'none';
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = `Error: ${msg}`;
    el.style.display = 'block';
    document.getElementById('emptyState').style.display = 'none';
  }

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }
</script>
</body>
</html>
